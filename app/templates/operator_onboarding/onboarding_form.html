{% extends 'base.html' %}

{% block title %}Onboarding Details — CHiPS Portal{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/common/common_style.css') }}">
<style>
    .onboarding-card {
        background: var(--surface-card);
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        padding: 24px;
        margin-bottom: 24px;
        border: 1px solid var(--border-strong);
        color: var(--text-primary);
    }

    .onboarding-card h3 {
        margin: 0 0 24px 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 12px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }

    .form-group select,
    .form-group input[type="text"] {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        font-size: 14px;
        color: var(--text-primary);
        background-color: var(--surface-input);
    }

    .form-group select:focus,
    .form-group input[type="text"]:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
    }

    .btn-submit {
        background-color: #3b82f6;
        color: white;
        border: none;
        padding: 10px 32px;
        border-radius: 20px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
        display: block;
        margin: 24px auto 0 auto;
    }

    .btn-submit:hover {
        background-color: #2563eb;
    }
</style>
{% endblock %}

{% block content %}

<div class="chips-header-banner">
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div
                style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: #cbd5e1;">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <line x1="19" y1="8" x2="19" y2="14"></line>
                    <line x1="16" y1="11" x2="22" y2="11"></line>
                </svg>
            </div>
            <div>
                <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: white;">Operator Onboarding</h1>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: #cbd5e1;">Onboarding and other details entry after
                    L2 done</p>
            </div>
        </div>
    </div>
</div>

<div class="onboarding-card">
    <h3>Operator Onboarding Form</h3>
    <form id="onboarding-form">

        <div class="form-group" style="max-width: 500px;">
            <label>Station ID <span style="color: #dc2626;">*</span></label>
            <select id="station_id" required>
                <option value="" disabled selected>--- Select Station Id ---</option>
            </select>
        </div>

        <div class="row-3">
            <div class="form-group">
                <label>Operator Onboarding Status <span style="color: #dc2626;">*</span></label>
                <select id="onboarding_status" required>
                    <option value="" disabled selected>Choose...</option>
                    <option value="Completed">Completed</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>
            <div class="form-group">
                <label>ASK Kit Working Status <span style="color: #dc2626;">*</span></label>
                <select id="ask_kit_status" required>
                    <option value="" disabled selected>Choose...</option>
                    <option value="Working">Working</option>
                    <option value="Not Working">Not Working</option>
                </select>
            </div>
            <div class="form-group">
                <label>Permitted For 18+ Enrollment <span style="color: #dc2626;">*</span></label>
                <select id="permitted_18_plus" required>
                    <option value="" disabled selected>Choose...</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Remark</label>
            <input type="text" id="remark" placeholder="Enter a Remark">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Submit</button>

    </form>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        loadOptions();

        document.getElementById('onboarding-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const stationId = document.getElementById('station_id').value;
            const onboardingStatus = document.getElementById('onboarding_status').value;
            const askKitStatus = document.getElementById('ask_kit_status').value;
            const permitted18 = document.getElementById('permitted_18_plus').value;
            const remark = document.getElementById('remark').value;

            if (!stationId || !onboardingStatus || !askKitStatus || !permitted18) {
                Swal.fire({ icon: 'warning', title: 'Missing Fields', text: 'Please fill in all required fields.' });
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            try {
                const response = await fetch('/auth/dc/operator-onboarding', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        station_id: stationId,
                        onboarding_status: onboardingStatus,
                        ask_kit_working_status: askKitStatus,
                        permitted_18_plus: permitted18,
                        remark: remark
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Submitted Successfully',
                        text: 'The operator onboarding details have been saved.',
                        timer: 2000,
                        showConfirmButton: false
                    });

                    document.getElementById('onboarding-form').reset();
                    loadOptions(); // Refresh the list of pending station IDs
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: data.detail || 'Could not save details.' });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Network Error', text: 'Could not connect to server.' });
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit';
            }
        });
    });

    async function loadOptions() {
        try {
            const res = await fetch('/auth/dc/operator-onboarding/options');
            if (!res.ok) return;
            const data = await res.json();

            const stationSelect = document.getElementById('station_id');
            stationSelect.innerHTML = '<option value="" disabled selected>--- Select Station Id ---</option>';
            data.station_ids.forEach(sid => {
                const opt = document.createElement('option');
                opt.value = sid;
                opt.textContent = sid;
                stationSelect.appendChild(opt);
            });

        } catch (e) {
            console.error("Failed to load options", e);
        }
    }
</script>
{% endblock %}
