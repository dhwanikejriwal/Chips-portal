{% extends 'base.html' %}

{% block title %}New Station ID Request — CHiPS Portal{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dc/dc_style.css') }}">
<style>
    .spin {
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>
{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="/auth/dc/station-id/list" class="oa-btn-back"
        style="font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Dashboard
    </a>
</div>

<h2>Submit Station ID Request</h2>

<form id="sid-request-form">
    <div class="form-card-container">

        <!-- Request Details -->
        <div class="form-grid-2x">

            <!-- District -->
            <div class="input-group">
                <label
                    style="font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">District
                    <span class="required-star">*</span></label>
                <select name="district" required disabled
                    style="height:38px; width:100%; box-sizing:border-box; padding:6px 12px; border:1px solid #cbd5e1; border-radius:4px; cursor:not-allowed;"
                    class="form-control-input oa-readonly-input">
                    <option value="{{ session.get('district_id') }}" selected>{{ session.get('district_name', 'Select
                        District') }}</option>
                </select>
                <input type="hidden" name="district_id" value="{{ session.get('district_id', '') }}">
                <div style="font-size: 11px; color: #94a3b8; margin-top: 5px;">Pre-filled from your account</div>
            </div>


            <!-- Model Selection -->
            <div class="input-group">
                <label
                    style="font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">Model
                    Selection <span class="required-star">*</span></label>
                <select name="model" id="model-select" class="form-control-input" required
                    style="height:38px; width:100%; box-sizing:border-box; padding:6px 12px; border:1px solid #cbd5e1; border-radius:4px;">
                    <option value="" disabled selected>Select Model Type</option>
                    <option value="ECMP">ECMP (In House)</option>
                    <option value="UCL">UCL (External)</option>
                </select>
            </div>

            <!-- User Type -->
            <div class="input-group">
                <label
                    style="font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">User
                    Type <span class="required-star">*</span></label>
                <select name="user_type" id="user-type-select" class="form-control-input" required
                    style="height:38px; width:100%; box-sizing:border-box; padding:6px 12px; border:1px solid #cbd5e1; border-radius:4px;"
                    onchange="toggleCustomReason()">
                    <option value="" disabled selected>Select User Type</option>
                    <option value="new_user">New User (Fresh Assignment)</option>
                    <option value="machine_id">Machine ID (Replace/Reset)</option>
                    <option value="custom">Custom Reason</option>
                </select>
            </div>

            <!-- Number of Kits -->
            <div class="input-group">
                <label
                    style="font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: block;">Number
                    of Kits <span class="required-star">*</span></label>
                <div style="display: flex; align-items: center;">
                    <button type="button" onclick="updateKits(-1)"
                        style="border-radius: 6px 0 0 6px; border: 1px solid #cbd5e1; background: #f8fafc; padding: 0 16px; height: 42px; cursor: pointer; font-size: 18px; font-weight: 600; color: #475569; transition: all 0.2s;">−</button>
                    <input type="number" id="number-of-kits" name="number_of_kits" value="1" min="1" max="999" required
                        style="border-radius: 0; border: 1px solid #cbd5e1; border-left: none; border-right: none; text-align: center; height: 42px; width: 80px; font-weight: 600; color: #1e293b; font-size: 15px; appearance: textfield; -moz-appearance: textfield; box-sizing: border-box;"
                        onkeydown="return event.keyCode !== 38 && event.keyCode !== 40;">
                    <button type="button" onclick="updateKits(1)"
                        style="border-radius: 0 6px 6px 0; border: 1px solid #cbd5e1; background: #f8fafc; padding: 0 16px; height: 42px; cursor: pointer; font-size: 18px; font-weight: 600; color: #475569; transition: all 0.2s;">+</button>
                </div>
            </div>

        </div>

        <!-- Custom reason reveal -->
        <div id="custom-reason-wrapper" style="display: none; margin-top: 20px;">
            <div
                style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="2.5">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg>
                Custom Reason <span class="required-star">*</span>
            </div>
            <textarea id="custom-reason-input" name="user_type_custom_reason" class="form-control-input"
                style="min-height: 90px; resize: vertical;"
                placeholder="Describe your specific reason for this Station ID request in detail..."></textarea>
        </div>

        <!-- Form Actions -->
        <div class="flex-actions-between" style="margin-top: 25px; align-items: center;">
            <a href="/auth/dc/station-id/list"
                onclick="if(typeof window.clearStationIdDraftAndForm === 'function') window.clearStationIdDraftAndForm();"
                class="btn-cancel"
                style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; height: 38px; box-sizing: border-box;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                Cancel
            </a>
            <div style="display: flex; gap: 12px;">
                <button type="button" class="btn-secondary" onclick="clearStationIdForm();"
                    style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; height: 38px; box-sizing: border-box;">
                    Clear Fields
                </button>
                <button type="submit" class="btn-primary" id="submit-btn"
                    style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; height: 38px; box-sizing: border-box;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        id="submit-icon" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                    Submit Request
                </button>
            </div>
        </div>
    </div>
</form>

<script>
    // ── Number of Kits Counter ──────────────────────────────────────
    function updateKits(change) {
        const input = document.getElementById('number-of-kits');
        let val = parseInt(input.value) || 1;
        val += change;
        if (val < 1) val = 1;
        if (val > 999) val = 999;
        input.value = val;
    }

    // ── Show/hide custom reason ────────────────────────────────────
    function toggleCustomReason() {
        const userType = document.getElementById('user-type-select').value;
        const wrapper = document.getElementById('custom-reason-wrapper');
        const textarea = document.getElementById('custom-reason-input');
        if (userType === 'custom') {
            wrapper.style.display = 'block';
            textarea.required = true;
            textarea.focus();
        } else {
            wrapper.style.display = 'none';
            textarea.required = false;
            textarea.value = '';
        }
    }

    // ── AJAX Submit ────────────────────────────────────────────────
    document.getElementById('sid-request-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const model = document.getElementById('model-select').value;
        if (!model) {
            Swal.fire({ icon: 'warning', title: 'Model Required', text: 'Please select a deployment model.', confirmButtonColor: '#4f46e5' });
            return;
        }

        const userType = document.getElementById('user-type-select').value;
        if (!userType) {
            Swal.fire({ icon: 'warning', title: 'User Type Required', text: 'Please select a user type.', confirmButtonColor: '#4f46e5' });
            return;
        }

        if (userType === 'custom' && !document.getElementById('custom-reason-input').value.trim()) {
            Swal.fire({ icon: 'warning', title: 'Custom Reason Required', text: 'Please describe your custom reason.', confirmButtonColor: '#4f46e5' });
            return;
        }

        const kitsInput = document.getElementById('number-of-kits');
        const kits = parseInt(kitsInput.value);
        if (!kits || kits < 1) {
            Swal.fire({ icon: 'warning', title: 'Kits Required', text: 'Please enter at least 1 kit.', confirmButtonColor: '#4f46e5' });
            return;
        }

        const btn = document.getElementById('submit-btn');
        const icon = document.getElementById('submit-icon');
        btn.disabled = true;
        icon.innerHTML = '<circle cx="12" cy="12" r="10"/>';
        icon.classList.add('spin');
        btn.childNodes[2].textContent = ' Submitting…';

        try {
            const resp = await fetch('/auth/dc/station-id/new', { method: 'POST', body: new FormData(this) });
            const data = await resp.json();

            if (data.success) {
                Swal.fire({
                    title: 'Submitted Successfully',
                    text: 'Your Station ID request has been submitted successfully.',
                    icon: 'success',
                    confirmButtonColor: '#378ADD',
                    showConfirmButton: true,
                    timer: 3000,
                    timerProgressBar: true
                }).then(() => {
                    if (typeof window.clearStationIdDraftAndForm === 'function') {
                        window.clearStationIdDraftAndForm();
                    } else if (typeof clearStationIdForm === 'function') {
                        clearStationIdForm();
                    }
                    window.location.href = '/auth/dc/station-id/list';
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Submission Failed', text: data.detail || 'Something went wrong.', confirmButtonColor: '#4f46e5' });
                resetBtn();
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Please check your connection and try again.', confirmButtonColor: '#4f46e5' });
            resetBtn();
        }
    });

    function resetBtn() {
        const btn = document.getElementById('submit-btn');
        const icon = document.getElementById('submit-icon');
        btn.disabled = false;
        icon.classList.remove('spin');
        icon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
        btn.childNodes[2].textContent = ' Submit Request';
    }

    function clearStationIdForm() {
        sessionStorage.removeItem('sid_request_draft');
        document.getElementById('sid-request-form').reset();
        document.getElementById('custom-reason-wrapper').style.display = 'none';
        document.getElementById('custom-reason-input').required = false;
        document.getElementById('number-of-kits').value = 1;
    }

    // Draft saving and restoring logic
    const DRAFT_KEY = 'sid_request_draft';

    window.saveSidDraft = function () {
        const form = document.getElementById('sid-request-form');
        if (!form) return;
        const formData = new FormData(form);
        const draft = {};
        for (let [key, value] of formData.entries()) {
            if (value instanceof File) continue;
            draft[key] = value;
        }
        sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    };

    window.loadSidDraft = function () {
        const draftStr = sessionStorage.getItem(DRAFT_KEY);
        if (!draftStr) return;
        try {
            const draft = JSON.parse(draftStr);
            for (let key in draft) {
                const el = document.getElementById(key) || document.getElementsByName(key)[0];
                if (el && el.type !== 'file' && el.type !== 'hidden') {
                    el.value = draft[key];
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                    el.dispatchEvent(new Event('change', { bubbles: true }));
                }
            }
        } catch (e) {
            console.error("Error loading draft", e);
        }
    };

    window.clearStationIdDraftAndForm = function () {
        sessionStorage.removeItem(DRAFT_KEY);
        if (typeof clearStationIdForm === 'function') {
            clearStationIdForm();
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('sid-request-form');
        if (form) {
            form.addEventListener('input', window.saveSidDraft);
            form.addEventListener('change', window.saveSidDraft);
        }

        let isReloadOrBack = false;
        const navEntries = performance.getEntriesByType('navigation');
        if (navEntries.length > 0) {
            const navType = navEntries[0].type;
            isReloadOrBack = (navType === 'reload' || navType === 'back_forward');
        } else if (window.performance && window.performance.navigation) {
            const t = window.performance.navigation.type;
            isReloadOrBack = (t === 1 || t === 2);
        }

        if (isReloadOrBack) {
            window.clearStationIdDraftAndForm();
            return;
        }

        window.loadSidDraft();
    });
</script>
{% endblock %}
