<!-- Gmail Compose Backdrop for Fullscreen Mode -->
<div id="gmailComposeBackdrop" class="gmail-compose-backdrop"></div>

<!-- Gmail-Style Mail Composer Floating Window Component -->
<div id="gmailComposeContainer" class="gmail-compose-container" style="display: none !important;">
    <div class="gmail-compose-window">
        <!-- Header -->
        <div class="gmail-compose-header">
            <span class="gmail-header-title" id="gmailHeaderTitle">New Message</span>
            <div class="gmail-header-actions">
                <button type="button" title="Minimize" class="gmail-header-btn" id="gmailBtnMinimize"><i class="ti ti-minus"></i></button>
                <button type="button" title="Full screen" class="gmail-header-btn" id="gmailBtnExpand"><i class="ti ti-arrows-maximize"></i></button>
                <button type="button" title="Close" class="gmail-header-btn" id="gmailBtnClose"><i class="ti ti-x"></i></button>
            </div>
        </div>

        <!-- Body / Fields Container -->
        <div class="gmail-compose-body">
            <!-- Recipients: TO -->
            <div class="gmail-input-row">
                <span class="gmail-input-label">To</span>
                <input type="email" id="gmailMailTo" class="gmail-input-field" placeholder="Recipients" autocomplete="off" />
                <div class="gmail-toggles">
                    <span id="toggleCcBtn" class="gmail-toggle-link me-2">Cc</span>
                    <span id="toggleBccBtn" class="gmail-toggle-link">Bcc</span>
                </div>
            </div>

            <!-- Recipients: CC (Hidden by default) -->
            <div class="gmail-input-row d-none" id="rowCc">
                <span class="gmail-input-label">Cc</span>
                <input type="email" id="gmailMailCc" class="gmail-input-field" placeholder="CC Recipients (comma separated)" autocomplete="off" />
            </div>

            <!-- Recipients: BCC (Hidden by default) -->
            <div class="gmail-input-row d-none" id="rowBcc">
                <span class="gmail-input-label">Bcc</span>
                <input type="email" id="gmailMailBcc" class="gmail-input-field" placeholder="BCC Recipients (comma separated)" autocomplete="off" />
            </div>

            <!-- Subject -->
            <div class="gmail-input-row">
                <input type="text" id="gmailMailSubject" class="gmail-input-field gmail-subject-field" placeholder="Subject" autocomplete="off" />
            </div>

            <!-- Attachment Badge / Pill -->
            <div class="gmail-attachment-container p-2 border-bottom">
                <input type="file" id="gmailCustomFileInput" multiple style="display: none;" />

                <div class="gmail-attachment-pill" id="gmailAttachmentPill" style="display: flex !important;">
                    <i class="ti ti-file-text text-success fs-4 me-2"></i>
                    <div class="d-flex flex-column me-auto">
                        <span id="gmailAttachmentName" class="fw-semibold text-dark small text-break">export_dataset.csv</span>
                        <span id="gmailAttachmentInfo" class="text-muted" style="font-size: 11px;">1 record attached</span>
                    </div>
                    <div class="d-flex align-items-center ms-2">
                        <button type="button" class="btn btn-sm btn-light text-primary border me-1 px-2 py-1" id="btnPreviewAttachment" style="font-size: 12px;" title="View / Download CSV export file">
                            <i class="ti ti-eye me-1"></i>View
                        </button>
                        <button type="button" class="btn btn-sm btn-light text-danger border px-2 py-1" id="btnRemoveAttachment" style="font-size: 12px;" title="Remove CSV attachment">
                            <i class="ti ti-x me-1"></i>Remove
                        </button>
                    </div>
                </div>

                <div id="gmailAttachmentDetached" class="p-2 m-0 align-items-center justify-content-between rounded border border-warning-subtle" style="display: none !important; background-color: #fff8e6; font-size: 12px;">
                    <span class="text-dark"><i class="ti ti-alert-triangle me-1 text-warning fs-6"></i>No attachment (CSV detached).</span>
                    <button type="button" class="btn btn-sm btn-outline-primary px-2 py-1" id="btnReattachAttachment" style="font-size: 11px;">
                        <i class="ti ti-paperclip me-1"></i>Re-attach CSV
                    </button>
                </div>

                <!-- Custom User Attachments Container -->
                <div id="gmailCustomAttachmentsList" class="d-flex flex-column gap-2 mt-2"></div>
            </div>

            <!-- Rich Content Editor Area -->
            <div class="gmail-editor-wrapper">
                <div id="gmailEditorContent" class="gmail-editor-content" contenteditable="true" spellcheck="true"></div>
            </div>
        </div>

        <!-- Formatting Toolbar (Font style removed per user request) -->
        <div class="gmail-formatting-bar" id="gmailFormattingBar">
            <button type="button" class="gmail-tool-btn" data-command="undo" title="Undo"><i class="ti ti-arrow-back-up"></i></button>
            <button type="button" class="gmail-tool-btn" data-command="redo" title="Redo"><i class="ti ti-arrow-forward-up"></i></button>
            <div class="vr mx-1 my-auto" style="height: 16px;"></div>
            <button type="button" class="gmail-tool-btn" data-command="bold" title="Bold"><span class="fw-bold fs-6">B</span></button>
            <button type="button" class="gmail-tool-btn" data-command="italic" title="Italic"><span class="fst-italic fs-6">I</span></button>
            <button type="button" class="gmail-tool-btn" data-command="underline" title="Underline"><span class="text-decoration-underline fs-6">U</span></button>
            <div class="vr mx-1 my-auto" style="height: 16px;"></div>
            <button type="button" class="gmail-tool-btn" data-command="insertUnorderedList" title="Bulleted list"><i class="ti ti-list"></i></button>
            <button type="button" class="gmail-tool-btn" data-command="insertOrderedList" title="Numbered list"><i class="ti ti-list-numbers"></i></button>
            <button type="button" class="gmail-tool-btn" data-command="justifyLeft" title="Align left"><i class="ti ti-align-left"></i></button>
            <button type="button" class="gmail-tool-btn" data-command="justifyCenter" title="Align center"><i class="ti ti-align-center"></i></button>
            <button type="button" class="gmail-tool-btn" data-command="removeFormat" title="Clear formatting"><i class="ti ti-eraser"></i></button>
        </div>

        <!-- Footer Bar -->
        <div class="gmail-compose-footer">
            <div class="d-flex align-items-center gap-2">
                <!-- Primary Send Button -->
                <button type="button" class="btn btn-primary gmail-send-btn shadow-sm" id="gmailSubmitSend">
                    <i class="ti ti-send me-1"></i> Send
                </button>
                
                <!-- Formatting Toolbar Toggle Icon -->
                <button type="button" class="gmail-icon-btn active" id="btnToggleFormatting" title="Formatting options">
                    <span class="fw-bold fs-6">Aa</span>
                </button>
                <button type="button" class="gmail-icon-btn" id="btnFooterPaperclip" title="Attach / Re-attach CSV file">
                    <i class="ti ti-paperclip"></i>
                </button>
            </div>

            <div class="d-flex align-items-center gap-1">
                <button type="button" class="gmail-icon-btn text-danger" id="gmailDiscardBtn" title="Discard draft / Close">
                    <i class="ti ti-trash"></i>
                </button>
            </div>
        </div>
    </div>
</div>
