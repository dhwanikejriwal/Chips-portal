server {
    listen 80;
    server_name _; # Catch-all
    client_max_body_size 50M;

    # Timeouts extended for OCR document processing
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Serve static assets directly from Nginx (lightning fast, relieves Gunicorn workers)
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve favicon directly using chips_logo.jpg
    location = /favicon.ico {
        alias /app/static/css/images/chips_logo.jpg;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://frontend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
